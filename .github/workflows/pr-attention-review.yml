# Classification-only PR attention router. It never approves, merges,
# deploys, releases, or changes PR source; its only repository write is the
# persistent classification comment.
#
# workflow_run loads this file from the default branch. Every job checks out
# that trusted commit at github.sha; the PR is separate under .par/target and
# is inspected read-only. `check:workflow` enforces this contract.
# Acceptance probe: this comment-only change must classify as HIGH.
name: PR Attention Review

on:
  workflow_run:
    workflows: [Validate repository]
    types: [completed]

permissions:
  contents: read

env:
  PAR_ROUTER: packages/pr-attention-router
  PAR_ADAPTER: config/pr-attention-router

concurrency:
  group: attention-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Collect trusted evidence
    # Same-repository PRs only. Fork PRs never reach a job that holds secrets.
    if: >
      vars.PAR_APP_WORKFLOWS_ENABLED == 'true' &&
      (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deterministic-json: ${{ steps.export-evidence.outputs.json }}
      pr-context-json: ${{ steps.pr-context.outputs.context }}

    steps:
      - name: Check out trusted router from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pull request for inspection
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .par/target

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read and authorize pull request context
        id: pr-context
        uses: actions/github-script@v8
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          PAR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { readPrMaterialContext } = require(
              `${process.cwd()}/${process.env.PAR_ROUTER}/lib/readPrMaterialContext.cjs`,
            );
            const number = Number(process.env.PAR_PR_NUMBER);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });

            if (pullRequest.head.repo?.full_name !== repository) {
              throw new Error('Only same-repository pull requests are classified.');
            }

            if (pullRequest.user.type !== 'User') {
              throw new Error('Only human-authored pull requests are classified.');
            }

            const { data: authorPermission } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: pullRequest.user.login,
              });

            if (!['admin', 'maintain', 'write'].includes(authorPermission.role_name)) {
              throw new Error('The pull request author lacks write access to this repository.');
            }

            if (pullRequest.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              throw new Error('The pull request changed after validation; wait for the next run.');
            }

            const body = pullRequest.body ?? '';
            const jiraReference = `${pullRequest.title}\n${body}`.match(
              /\b[A-Z][A-Z0-9]+-\d+\b/u,
            )?.[0] ?? '';

            const prContext = {
              repository,
              number,
              title: pullRequest.title,
              url: pullRequest.html_url,
            };

            core.setOutput('title', pullRequest.title);
            core.setOutput('body', body);
            core.setOutput('jira-reference', jiraReference);
            core.setOutput('material-context', readPrMaterialContext(body));
            core.setOutput('context', JSON.stringify(prContext));

      - name: Collect deterministic evidence
        env:
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          PR_TITLE: ${{ steps.pr-context.outputs.title }}
          PR_BODY: ${{ steps.pr-context.outputs.body }}
          JIRA_REFERENCE: ${{ steps.pr-context.outputs.jira-reference }}
          MATERIAL_CONTEXT: ${{ steps.pr-context.outputs.material-context }}
          VALIDATION_STATUS: ${{ github.event.workflow_run.conclusion == 'success' && 'PASSED' || 'FAILED' }}
        run: |
          jira_arguments=()
          if [[ -n "$JIRA_REFERENCE" ]]; then
            jira_arguments=(--jira-reference "$JIRA_REFERENCE")
          fi

          node "$PAR_ROUTER/cli/collectPullRequestEvidence.ts" \
            --policy "$PAR_ADAPTER/policy.json" \
            --repository-directory .par/target \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --material-context "$MATERIAL_CONTEXT" \
            --validation-status "$VALIDATION_STATUS" \
            "${jira_arguments[@]}" > .par/evidence.json

      - name: Export bounded deterministic evidence
        id: export-evidence
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const evidence = fs.readFileSync('.par/evidence.json', 'utf8');

            if (Buffer.byteLength(evidence, 'utf8') > 400_000) {
              throw new Error('Deterministic evidence exceeds the job-output limit.');
            }

            const { assessment } = JSON.parse(evidence);
            await core.summary
              .addHeading('PR Attention deterministic floor', 2)
              .addRaw(`Floor: ${assessment.floor}`, true)
              .write();

            core.setOutput('json', evidence);

  classify:
    name: Classify with Codex
    needs: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ai-classification: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Check out trusted router from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pull request for inspection
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .par/target

      - name: Provide trusted evidence and prompt to Codex
        uses: actions/github-script@v8
        env:
          DETERMINISTIC_JSON: ${{ needs.evidence.outputs.deterministic-json }}
        with:
          script: |
            const fs = require('node:fs');
            const { PAR_ROUTER, PAR_ADAPTER } = process.env;
            fs.mkdirSync('.par/target', { recursive: true });
            fs.writeFileSync(
              '.par/target/evidence.json',
              process.env.DETERMINISTIC_JSON,
              'utf8',
            );
            fs.writeFileSync(
              '.par/classification-prompt.md',
              [
                fs.readFileSync(`${PAR_ROUTER}/lib/classification-prompt.md`, 'utf8'),
                fs.readFileSync(`${PAR_ADAPTER}/host-context.md`, 'utf8'),
              ].join('\n'),
              'utf8',
            );

      - name: Run read-only Codex classification
        id: codex
        uses: openai/codex-action@v1.8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: read-only
          working-directory: .par/target
          prompt-file: ${{ github.workspace }}/.par/classification-prompt.md
          output-schema-file: ${{ github.workspace }}/${{ env.PAR_ROUTER }}/lib/classification.schema.json

  finalize:
    name: Finalize attention result
    needs: [evidence, classify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should-notify: ${{ steps.inspect-comment.outputs.should-notify }}
      tier: ${{ steps.inspect-comment.outputs.tier }}
      classification-json: ${{ steps.inspect-comment.outputs.classification-json }}

    steps:
      - name: Check out trusted router from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enforce deterministic floor
        env:
          DETERMINISTIC_JSON: ${{ needs.evidence.outputs.deterministic-json }}
          AI_CLASSIFICATION_JSON: ${{ needs.classify.outputs.ai-classification }}
        run: |
          mkdir -p .par
          node "$PAR_ROUTER/cli/normalizeClassification.ts" \
            --deterministic-json "$DETERMINISTIC_JSON" \
            --ai-json "$AI_CLASSIFICATION_JSON" \
            --output .par/final-classification.json

      - name: Inspect existing PR attention state
        id: inspect-comment
        uses: actions/github-script@v8
        env:
          PAR_DRY_RUN: 'true'
          PAR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const inspect = require(
              `${process.cwd()}/${process.env.PAR_ROUTER}/lib/publishAttentionComment.cjs`,
            );
            await inspect({ github, context, core });

  email:
    name: Send changed-tier email
    needs: [evidence, finalize]
    if: >-
      needs.finalize.outputs.should-notify == 'true' &&
      vars.PAR_EMAIL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out trusted router from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Root lockfile, router workspace only: installs nodemailer and yaml.
      - name: Install the email adapter's runtime dependency
        run: >-
          npm ci --omit=dev --ignore-scripts
          --workspace @scope/pr-attention-router
          --include-workspace-root=false

      - name: Send attention email
        env:
          CLASSIFICATION_JSON: ${{ needs.finalize.outputs.classification-json }}
          PR_CONTEXT_JSON: ${{ needs.evidence.outputs.pr-context-json }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          PAR_EMAIL_FROM: ${{ vars.PAR_EMAIL_FROM }}
          PAR_EMAIL_TO_TEAM: ${{ vars.PAR_EMAIL_TO_TEAM }}
          PAR_EMAIL_TO_LEAD: ${{ vars.PAR_EMAIL_TO_LEAD }}
        run: |
          node "$PAR_ROUTER/cli/sendAttentionEmail.ts" \
            --classification-json "$CLASSIFICATION_JSON" \
            --pr-context-json "$PR_CONTEXT_JSON"

  slack:
    name: Send changed-tier Slack message
    needs: [evidence, finalize]
    if: >-
      needs.finalize.outputs.should-notify == 'true' &&
      vars.PAR_SLACK_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out trusted router from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Send Slack attention message
        env:
          CLASSIFICATION_JSON: ${{ needs.finalize.outputs.classification-json }}
          PR_CONTEXT_JSON: ${{ needs.evidence.outputs.pr-context-json }}
          PAR_SLACK_CHANNEL_ID: ${{ vars.PAR_SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          node "$PAR_ROUTER/cli/sendAttentionSlack.ts" \
            --classification-json "$CLASSIFICATION_JSON" \
            --pr-context-json "$PR_CONTEXT_JSON"

  publish:
    name: Publish attention result
    needs: [finalize, email, slack]
    if: >
      always() &&
      needs.finalize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Record notification outcomes
        env:
          EMAIL_RESULT: ${{ needs.email.result }}
          SLACK_RESULT: ${{ needs.slack.result }}
        run: |
          {
            echo '## PR Attention notification outcomes'
            echo
            echo "- Email: $EMAIL_RESULT"
            echo "- Slack: $SLACK_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out trusted router from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restore finalized classification
        uses: actions/github-script@v8
        env:
          CLASSIFICATION_JSON: ${{ needs.finalize.outputs.classification-json }}
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('.par', { recursive: true });
            fs.writeFileSync(
              '.par/final-classification.json',
              process.env.CLASSIFICATION_JSON,
              'utf8',
            );

      - name: Create or update persistent PR comment
        uses: actions/github-script@v8
        env:
          PAR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const publish = require(
              `${process.cwd()}/${process.env.PAR_ROUTER}/lib/publishAttentionComment.cjs`,
            );
            await publish({ github, context, core });

# Classification-only PR attention router. Code sets a floor from path rules,
# failing CI, and change size; Codex applies the repository rubric and may
# raise it; the higher tier wins. It never approves, merges, deploys, or
# changes PR source. Its only writes are one PR comment and a short Slack
# and email alert. See docs/runbooks/pr-attention-notification.md.
#
# Trust model: workflow_run always loads this file from the default branch,
# and both jobs check the router and host config out at github.sha. Only
# classify checks out the PR head (under .par/target), and only reads it.
# classify holds the OpenAI key and cannot write; publish can comment, post to
# Slack, and send email but never sees PR code.
name: PR Attention Review

on:
  workflow_run:
    workflows: [Validate repository]
    types: [completed]

permissions:
  contents: read

env:
  PAR_ROUTER: packages/pr-attention-router
  PAR_ADAPTER: config/pr-attention-router

# Runs queue rather than cancel, so a run is never stopped between posting the
# comment and sending its Slack alert.
concurrency:
  group: attention-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify
    # Same-repository PRs only. Fork PRs never reach a job that holds secrets.
    if: >
      vars.PAR_APP_WORKFLOWS_ENABLED == 'true' &&
      (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      evidence: ${{ steps.evidence.outputs.json }}
      pull-request: ${{ steps.authorize.outputs.pull-request }}
      ai: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Check out trusted router and rules from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pull request for inspection
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .par/target

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Authorize pull request
        id: authorize
        uses: actions/github-script@v8
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          VALIDATED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PAR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('node:fs');
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PAR_PR_NUMBER),
            });

            if (pullRequest.head.repo?.full_name !== repository) {
              throw new Error('Only same-repository pull requests are classified.');
            }
            if (pullRequest.user.type !== 'User') {
              throw new Error('Only human-authored pull requests are classified.');
            }
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: pullRequest.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.role_name)) {
              throw new Error('The pull request author lacks write access to this repository.');
            }
            if (
              pullRequest.head.sha !== process.env.EXPECTED_HEAD_SHA ||
              pullRequest.head.sha !== process.env.VALIDATED_HEAD_SHA
            ) {
              throw new Error('The pull request changed after validation; wait for the next run.');
            }

            const summary = {
              number: pullRequest.number,
              title: pullRequest.title,
              url: pullRequest.html_url,
            };
            fs.writeFileSync(
              '.par/pull-request.json',
              JSON.stringify({ ...summary, body: pullRequest.body ?? '' }),
            );
            core.setOutput('pull-request', JSON.stringify(summary));

      - name: Collect changed paths, size, and validation result
        id: evidence
        env:
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          VERIFY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # --no-renames lists both sides of a move, so a protected old path still matches.
          git -C .par/target diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > .par/paths.z
          git -C .par/target diff --numstat "$BASE_SHA...$HEAD_SHA" > .par/numstat.txt
          node "$PAR_ROUTER/route.ts" evidence .par/paths.z .par/numstat.txt \
            "$VERIFY_CONCLUSION" "$BASE_SHA" "$HEAD_SHA" > .par/evidence.json
          echo "json=$(cat .par/evidence.json)" >> "$GITHUB_OUTPUT"

      - name: Build the classification prompt
        run: |
          node "$PAR_ROUTER/route.ts" prompt "$PAR_ADAPTER" .par/evidence.json \
            .par/pull-request.json > .par/prompt.md

      # A Codex failure, or PAR_AI_ENABLED=false, leaves the AI output empty and
      # publish falls back to the deterministic floor.
      - name: Classify with Codex (read-only)
        id: codex
        if: vars.PAR_AI_ENABLED != 'false'
        continue-on-error: true
        # Under the job's 20 minutes, so a hung Codex still leaves classify green.
        timeout-minutes: 12
        uses: openai/codex-action@v1.8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: read-only
          working-directory: .par/target
          prompt-file: ${{ github.workspace }}/.par/prompt.md
          output-schema-file: ${{ github.workspace }}/${{ env.PAR_ROUTER }}/classification.schema.json

  publish:
    name: Publish
    needs: classify
    if: needs.classify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out trusted router and rules from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read the existing attention comment
        id: existing
        uses: actions/github-script@v8
        env:
          PAR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const marker = /<!--\s*par:v1 tier=(LOW|MEDIUM|HIGH)\s*-->/u;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: Number(process.env.PAR_PR_NUMBER),
              per_page: 100,
            });
            // Only this workflow's own comment counts, so a pasted marker cannot suppress alerts.
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.user.login === 'github-actions[bot]' &&
                marker.test(comment.body ?? ''),
            );
            core.setOutput('comment-id', existing ? String(existing.id) : '');
            core.setOutput('previous-tier', existing ? marker.exec(existing.body)[1] : '');

      - name: Route
        env:
          EVIDENCE_JSON: ${{ needs.classify.outputs.evidence }}
          PULL_REQUEST_JSON: ${{ needs.classify.outputs.pull-request }}
          AI_OUTPUT: ${{ needs.classify.outputs.ai }}
          PREVIOUS_TIER: ${{ steps.existing.outputs.previous-tier }}
        run: |
          mkdir -p .par
          printf '%s' "$EVIDENCE_JSON" > .par/evidence.json
          printf '%s' "$PULL_REQUEST_JSON" > .par/pull-request.json
          printf '%s' "$AI_OUTPUT" > .par/ai.json
          node "$PAR_ROUTER/route.ts" route "$PAR_ADAPTER" .par/evidence.json .par/ai.json \
            .par/pull-request.json "$PREVIOUS_TIER" > .par/result.json
          jq -r '"Final tier \(.finalTier) (floor \(.deterministicFloor), AI used: \(.aiUsed))"' \
            .par/result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the PR comment
        uses: actions/github-script@v8
        env:
          PAR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          COMMENT_ID: ${{ steps.existing.outputs.comment-id }}
        with:
          script: |
            const { comment } = JSON.parse(require('node:fs').readFileSync('.par/result.json', 'utf8'));
            if (process.env.COMMENT_ID) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: Number(process.env.COMMENT_ID),
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: Number(process.env.PAR_PR_NUMBER),
                body: comment,
              });
            }

      # After the comment, and never able to fail the run.
      - name: Send the Slack alert on the first result or a tier change
        if: vars.PAR_SLACK_ENABLED == 'true'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PAR_SLACK_CHANNEL_ID: ${{ vars.PAR_SLACK_CHANNEL_ID }}
        run: |
          if [ "$(jq -r .shouldNotify .par/result.json)" != true ]; then
            echo 'Tier unchanged; no Slack alert.'
            exit 0
          fi
          jq --arg channel "$PAR_SLACK_CHANNEL_ID" '{channel: $channel, text: .notificationSummary}' \
            .par/result.json > .par/slack.json
          curl --fail-with-body -sS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @.par/slack.json | jq -e '.ok == true'

      # Same rule and lines as Slack: HIGH goes to the lead list, LOW and MEDIUM to
      # the team list. Python's smtplib keeps the router package dependency-free.
      - name: Send the email alert on the first result or a tier change
        if: vars.PAR_EMAIL_ENABLED == 'true'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          PAR_EMAIL_FROM: ${{ vars.PAR_EMAIL_FROM }}
          PAR_EMAIL_TO_TEAM: ${{ vars.PAR_EMAIL_TO_TEAM }}
          PAR_EMAIL_TO_LEAD: ${{ vars.PAR_EMAIL_TO_LEAD }}
        shell: python
        run: |
          import json, os, smtplib
          from email.message import EmailMessage

          with open('.par/result.json', encoding='utf-8') as file:
              result = json.load(file)
          if not result['shouldNotify']:
              print('Tier unchanged; no email alert.')
              raise SystemExit(0)

          variable = 'PAR_EMAIL_TO_LEAD' if result['finalTier'] == 'HIGH' else 'PAR_EMAIL_TO_TEAM'
          recipients = [address.strip() for address in os.environ[variable].split(',') if address.strip()]
          if not recipients:
              raise SystemExit(f'{variable} has no recipients.')

          summary = result['notificationSummary']
          message = EmailMessage()
          message['From'] = os.environ['PAR_EMAIL_FROM']
          message['To'] = ', '.join(recipients)
          message['Subject'] = summary.split('\n', 1)[0]
          message.set_content(summary + '\n')

          with smtplib.SMTP(os.environ['SMTP_HOST'], int(os.environ['SMTP_PORT']), timeout=30) as smtp:
              smtp.send_message(message)
          print(f"Emailed {len(recipients)} recipient(s) for {result['finalTier']}.")

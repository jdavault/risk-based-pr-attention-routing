name: Validate repository

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: vars.PAR_APP_WORKFLOWS_ENABLED == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15

    steps:
      - name: Authorize trusted POC event
        run: |
          EVENT_NAME='${{ github.event_name }}'
          EVENT_ACTOR='${{ github.actor }}'
          PR_AUTHOR='${{ github.event.pull_request.user.login }}'
          PR_HEAD_REPOSITORY='${{ github.event.pull_request.head.repo.full_name }}'
          TARGET_REPOSITORY='${{ github.repository }}'

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$EVENT_ACTOR" == "jdavault" ]]; then
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" && \
                "$PR_AUTHOR" == "jdavault" && \
                "$PR_HEAD_REPOSITORY" == "$TARGET_REPOSITORY" ]]; then
            exit 0
          fi

          echo "::error::This local POC accepts only jdavault-authored, same-repository pull requests."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/attention-router/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/attention-router

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD~1 HEAD
          fi

      - name: Lint
        run: npm --prefix apps/attention-router run lint

      - name: Type-check
        run: npm --prefix apps/attention-router run typecheck

      - name: Test
        run: npm --prefix apps/attention-router test

      - name: Build
        run: npm --prefix apps/attention-router run build

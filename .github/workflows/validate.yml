name: Validate repository

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize and check whitespace
    if: vars.PAR_APP_WORKFLOWS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}

    steps:
      - name: Authorize trusted POC event
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" && \
                -n "$PR_AUTHOR" && \
                "$PR_HEAD_REPOSITORY" == "$TARGET_REPOSITORY" ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Only manually dispatched or same-repository pull-request validation is allowed."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD~1 HEAD
          fi

  router:
    name: Validate router package
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install router dependencies only
        run: >-
          npm ci --ignore-scripts
          --workspace @scope/pr-attention-router
          --include-workspace-root=false

      - name: Prove React is not installed
        working-directory: packages/pr-attention-router
        run: >-
          node --input-type=module -e
          "try { import.meta.resolve('react'); process.exit(1); } catch {}"

      - name: Check router package, policy, and workflow contract
        run: npm run check:router

  dashboard:
    name: Validate dashboard
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint --workspace attention-router-poc

      - name: Type-check
        run: npm run typecheck --workspace attention-router-poc

      - name: Test
        run: npm test --workspace attention-router-poc

      - name: Build
        run: npm run build --workspace attention-router-poc
